server {
    listen 80;
    server_name learnusmap.captainflow.ai;

    root /var/www/learnusmap.captainflow.ai/current/public;
    index index.html;

    access_log /var/log/nginx/learnusmap.captainflow.ai.access.log;
    error_log /var/log/nginx/learnusmap.captainflow.ai.error.log warn;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
